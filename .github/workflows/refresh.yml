name: Refresh profile card
on:
  schedule:
    - cron: "17 22 * * *"   # 06:17 Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile/**", "README.md", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build card from xmodx.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python profile/build.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg README.md; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg README.md
          git commit -m "Refresh profile card"
          git push
